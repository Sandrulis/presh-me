# One workflow, sequential jobs — private repos get 1 concurrent runner on GitHub Free;
# three separate workflows used to queue 2 of 3 checks for a long time.
name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  npm-audit:
    name: npm-audit
    needs: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high+)
        run: npm audit --audit-level=high

  smoke:
    name: smoke
    needs: npm-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: i18n catalog check
        run: npm run i18n:check

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint check
        run: npm run lint

      - name: Build (production)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://placeholder.example.com

      - name: Security - no hardcoded secrets
        run: |
          PATTERNS=(
            "sk_live_"
            "sk_test_"
            "SUPABASE_SERVICE_ROLE_KEY\s*=\s*\"ey"
          )
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rE "$pattern" app/ --include="*.ts" --include="*.tsx" -l 2>/dev/null | grep -v "node_modules" | grep -v ".env"; then
              echo "FAIL: Potential hardcoded secret: $pattern"
              FOUND=$((FOUND + 1))
            fi
          done
          if [ $FOUND -gt 0 ]; then exit 1; fi
          echo "OK: No hardcoded secrets found"

      - name: Security - API routes have auth checks
        run: |
          AUTH_MARKERS='(getUser|requireAdmin|createClient|auth\.getUser|requireTurnstileToken|constructEvent|loadPageOwnerUmamiReport|loadPublicBookingReservations|loadBookingCalendarFeed|authorizeCron)'
          for file in $(find app/api -name "route.ts"); do
            if grep -qE "export async function (GET|POST|PUT|DELETE|PATCH)" "$file"; then
              if ! grep -qE "$AUTH_MARKERS" "$file"; then
                echo "FAIL: No auth check in $file"
                exit 1
              fi
            fi
          done
          echo "OK: API auth check complete"

      - name: Security - headers configured
        run: |
          for header in "X-Frame-Options" "X-Content-Type-Options" "Referrer-Policy" "Permissions-Policy"; do
            if ! grep -q "$header" next.config.ts; then
              echo "FAIL: Missing security header: $header"
              exit 1
            fi
          done
          echo "OK: Security headers present"

      - name: Security - no eval() in production code
        run: |
          if grep -rn "\beval(" app/ --include="*.ts" --include="*.tsx" | grep -v "node_modules" | grep -v "// "; then
            echo "FAIL: eval() found"
            exit 1
          fi
          echo "OK: No eval() in app code"
